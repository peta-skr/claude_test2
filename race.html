<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ソートレース — AlgoViz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<script src="js/theme.js"></script>
</head>
<body>
<nav class="nav">
  <a class="brand" href="index.html"><span class="logo">A</span>AlgoViz</a>
  <a class="link" href="index.html">ホーム</a>
  <a class="link" href="sorting.html">ソート</a>
  <a class="link" href="searching.html">探索</a>
  <a class="link" href="pathfinding.html">経路探索</a>
  <a class="link" href="structures.html">データ構造</a>
  <a class="link active" href="race.html">レース</a>
  <a class="link" href="recursion.html">再帰</a>
  <button class="theme-toggle" id="themeToggle" aria-label="テーマ切替">🌙</button>
</nav>

<div class="container">
  <div class="page-head">
    <h1>🏁 ソートレース</h1>
    <p>複数のソートアルゴリズムを<strong>まったく同じデータ</strong>で同時に実行し、どれが最も少ない操作で完了するか競わせます。1ステップ＝1操作として全員が同じペースで進むので、総ステップ数が少ないほど上位になります。</p>
  </div>

  <div class="panel" style="flex-direction:column; align-items:stretch">
    <div class="algo-picker" id="picker"></div>
  </div>

  <div class="panel">
    <div class="control">
      <label for="size">データ数 <span class="value" id="sizeVal">50</span></label>
      <input type="range" id="size" min="15" max="120" value="50">
    </div>
    <div class="control">
      <label for="speed">速度 <span class="value" id="speedVal">速</span></label>
      <input type="range" id="speed" min="1" max="100" value="80">
    </div>
    <button class="btn" id="shuffle">🔀 データ生成</button>
    <button class="btn primary" id="start">🏁 スタート</button>
    <button class="btn danger" id="stop" disabled>■ 停止</button>
  </div>

  <div class="msg" id="msg" style="margin-bottom:18px"></div>

  <div class="race-grid" id="raceGrid"></div>
</div>

<footer class="footer">AlgoViz — ソートレース</footer>
<script src="js/sortcore.js"></script>
<script src="js/race.js"></script>
</body>
</html>
